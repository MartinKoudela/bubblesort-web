<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="./output.css" rel="stylesheet">
    <script src="js/bubbleSort.js" defer></script>
    <script src="js/script.js" defer></script>
    <title>Bubblesort - sort</title>
</head>
<body class="bg-gray-50 text-gray-900">
<header class="border-b border-gray-200 bg-white px-6 py-4">
    <div class="mx-auto flex max-w-2xl items-center justify-between">
        <a href="index.html" class="text-xl font-bold">Bubblesort</a>
        <nav>
            <ul class="flex gap-4 text-sm">
            <li><a href="index.html" class="font-semibold text-blue-600" aria-current="page">Sort</a></li>
            <li><a href="learn.html" class="text-gray-600 hover:text-gray-900">Learn</a></li>
            </ul>
        </nav>
    </div>
</header>
<main class="main mx-auto max-w-2xl px-6 py-8">
    <h1 class="mb-6 text-3xl font-bold">Sort numbers</h1>
    <section class="section">
        <form class="flex items-end gap-3">
            <label for="input" class="flex flex-col gap-1 text-sm text-gray-600">
                sort
                <input type="number" id="input"
                       class="rounded border border-gray-300 px-3 py-2 text-base text-gray-900 focus:border-gray-900 focus:outline-none">
            </label>
            <button type="button" id="addNum"
                    class="rounded bg-blue-500 px-4 py-2 text-white hover:bg-blue-600 focus:outline-none">Add
            </button>
            <button type="button" id="sort"
                    class="rounded bg-green-500 px-4 py-2 text-white hover:bg-green-600 focus:outline-none">Sort
            </button>
        </form>
        <div id="output" class="mt-4"></div>
        <div id="time" class="mt-4 text-sm text-gray-600"></div>
    </section>
</main>
</body>
</html>
